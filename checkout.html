<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Compra - MomMiel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-primario: #f4b2a8; 
            --color-secundario: #edd4b3; 
            --color-oscuro: #5c4b47;
        }
        body {
            background-color: #faf7f5;
            color: var(--color-oscuro);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-brand {
            font-weight: bold;
            color: var(--color-oscuro) !important;
        }
        .card-checkout {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }
        .btn-mommiel {
            background-color: var(--color-primario);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-mommiel:hover {
            background-color: #e09f95;
            color: white;
            transform: translateY(-2px);
        }
        .item-carrito {
            border-bottom: 1px solid #f0eae6;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .item-carrito:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-honey-pot text-warning me-2"></i>MomMiel
            </a>
            <a href="carrito.html" class="text-decoration-none text-muted">
                <i class="fa-solid fa-arrow-left me-1"></i> Volver al carrito
            </a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4">
            
            <div class="col-lg-7">
                <div class="card card-checkout p-4">
                    <h4 class="mb-4"><i class="fa-solid fa-truck text-danger me-2"></i>Datos de Envío</h4>
                    
                    <form id="formCheckout">
                        <div class="row g-3">
                            <div class="col-12">
                                <label for="telefono" class="form-label">Teléfono de contacto (10 dígitos)</label>
                                <input type="tel" class="form-control" id="telefono" placeholder="Ej. 4771234567" required pattern="[0-9]{10}">
                                <div class="form-text">Esencial para que la paquetería te localice.</div>
                            </div>

                            <div class="col-12">
                                <label for="direccion" class="form-label">Dirección (Calle, Número ext/int, Colonia)</label>
                                <input type="text" class="form-control" id="direccion" placeholder="Av. Paseo de los Insurgentes #123, Col. Centro" required>
                            </div>

                            <div class="col-md-6">
                                <label for="ciudad" class="form-label">Ciudad</label>
                                <input type="text" class="form-control" id="ciudad" placeholder="Ej. León" required>
                            </div>

                            <div class="col-md-6">
                                <label for="estado_republica" class="form-label">Estado</label>
                                <select class="form-select" id="estado_republica" required>
                                    <option value="" selected disabled>Selecciona tu estado...</option>
                                    <option value="Guanajuato">Guanajuato</option>
                                    <option value="CDMX">CDMX</option>
                                    <option value="Jalisco">Jalisco</option>
                                    <option value="Nuevo León">Nuevo León</option>
                                    <option value="Querétaro">Querétaro</option>
                                    </select>
                            </div>

                            <div class="col-md-6">
                                <label for="codigo_postal" class="form-label">Código Postal</label>
                                <input type="text" class="form-control" id="codigo_postal" placeholder="Ej. 37000" required pattern="[0-9]{5}">
                            </div>
                        </div>

                        <hr class="my-4">

                        <h4 class="mb-3"><i class="fa-solid fa-credit-card text-success me-2"></i>Método de Pago</h4>
                        <div class="alert alert-info">
                            <i class="fa-solid fa-circle-info me-2"></i>Por el momento en MomMiel manejamos <strong>Pago contra entrega</strong> o transferencia al recibir tu confirmación.
                        </div>

                        <button class="w-100 btn btn-mommiel btn-lg mt-3" type="submit" id="btnFinalizar">
                            <i class="fa-solid fa-bag-shopping me-2"></i>Confirmar y Pagar Pedido
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card card-checkout p-4 position-sticky" style="top: 20px;">
                    <h4 class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted">Tu Carrito</span>
                        <span class="badge bg-secondary rounded-pill" id="badgeCantidad">0</span>
                    </h4>
                    
                    <div id="listaResumenCarrito" class="mb-3" style="max-height: 300px; overflow-y: auto; padding-right: 5px;">
                        </div>

                    <hr>

                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="subtotalCheckout">$0.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Envío</span>
                        <span class="text-success font-weight-bold">¡Gratis!</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between font-weight-bold fs-5 mb-3">
                        <strong>Total:</strong>
                        <strong id="totalCheckout" class="text-danger">$0.00</strong>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/checkout.js"></script>
</body>
</html>
